<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Momo's Parasol Drop</title>
<style>html,body{margin:0;height:100%;background:#fbeee6;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}canvas{position:absolute}#rot{display:none;position:absolute;inset:0;z-index:9;background:#fbeee6;color:#5a3418;font:800 22px system-ui,sans-serif;align-items:center;justify-content:center;text-align:center}@media(orientation:landscape) and (pointer:coarse){#rot{display:flex}}</style>
</head><body><div id="rot">Please rotate your phone<br>to portrait 📱</div><canvas id="c"></canvas><script>
// ===== 1. CONFIG (tweak numbers here) =====
const W=360,H=780;   // portrait 9:19.5
const LEN=4800, TIME=40;                         // fall depth (px) and time limit (s)
const SPEED_OPEN=110, SPEED_CLOSED=250;          // fall speed px/s
const CANDY_MULT=1.5, CANDY_TIME=5, CANDY_CHANCE=0.2;
const MOMO_SCALE=0.22, MOMO_SCREEN_Y=220;
const HIT_OPEN=36, HIT_CLOSED=18;                // half-width of Momo hitbox
const MOVE_SPEED=230, TILT_MAX=25;
const WIND_X=140, WIND_Y=80;
const GAP_START=300, GAP_END=106, TUNNEL_TRIGGER=520;
// ===== 2. ASSETS =====
const FILES={sky:'assets/sky.png',cloudBig:'assets/cloud-big.png',cloudMid:'assets/cloud-mid.png',cloudSmall:'assets/cloud-small.png',
sidebird:'assets/sidebird.png',windside:'assets/windside.png',windup:'assets/windup.png',candy:'assets/candy.png',tunnel:'assets/tunnel-placeholder.png',
headNormal:'assets/momo/head-normal.png',headHappy:'assets/momo/head-happy.png',headHurt:'assets/momo/head-hurt.png',headSurprised:'assets/momo/head-surprised.png',
torso:'assets/momo/torso.png',armL:'assets/momo/arm-left-holding.png',armR:'assets/momo/arm-right-outstretched.png',
footL:'assets/momo/foot-left.png',footR:'assets/momo/foot-right.png',canopy:'assets/momo/parasol-canopy.png',closed:'assets/momo/closed-umbrella.png',shaft:'assets/momo/parasol-shaft-handle.png'};
const A={};
const loadAll=()=>Promise.all(Object.entries(FILES).map(([k,s])=>new Promise(r=>{const i=new Image();i.onload=()=>{A[k]=i;r()};i.onerror=r;i.src=s})));
// ===== 3. SETUP / HELPERS =====
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.style.left=(innerWidth-W*s)/2+'px';cv.style.top=(innerHeight-H*s)/2+'px'}
addEventListener('resize',fit);fit();
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
function img(k,x,y,sx=1,sy=sx,r=0){const i=A[k];if(!i)return;ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.scale(sx,sy);ctx.drawImage(i,-i.width/2,-i.height/2);ctx.restore()}
function panel(x,y,w,h){ctx.fillStyle='#fff4e6';ctx.strokeStyle='#5a3418';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x,y,w,h,18);ctx.fill();ctx.stroke()}
function text(t,x,y,size,col='#5a3418',al='center'){ctx.font=`800 ${size}px Nunito,"Baloo 2",ui-rounded,system-ui,sans-serif`;ctx.textAlign=al;ctx.fillStyle=col;ctx.fillText(t,x,y)}
// ===== 4. STATE =====
let state='title',mo,objs,tt=0,camY=0,timeLeft,candyT,openAmt,hold=false,tilt=0,keys={},endMsg='',endWin=false,endAt=0,gyroOn=false,flip=1,elapsed=0;
// ===== 5. LEVEL GENERATION =====
function buildLevel(){
 objs=[];let y=480;
 while(y<LEN-500){
  const r=Math.random();
  if(r<.34){ // clouds (stationary)
   for(let i=0;i<1+(Math.random()<.5);i++){const k=['cloudBig','cloudMid','cloudSmall'][Math.random()*3|0],im=A[k],w=im.width*.5,h=im.height*.5;
    objs.push({t:'cloud',img:k,x:rand(w/2,W-w/2),y:y+i*70,w,h})}y+=200;
  }else if(r<.58){objs.push({t:'bird',x:rand(40,W-40),y,dir:Math.random()<.5?-1:1,sp:rand(70,120),w:56,h:51});y+=210;
  }else if(r<.8){const ax=Math.random()<.5?'x':'y';objs.push({t:'wind',ax,dir:Math.random()<.5?-1:1,y,h:260});y+=300;
  }else{objs.push({t:'tunnel',y,h:90,c:rand(120,240),gap:GAP_START});y+=300}
  if(Math.random()<CANDY_CHANCE)objs.push({t:'candy',x:rand(40,W-40),y:y-90});
 }
}
function reset(){mo={x:W/2,y:0,vx:0,vy:60,hurt:false};timeLeft=TIME;candyT=0;openAmt=1;buildLevel()}
// ===== 6. INPUT (hold = close parasol | gyro / arrows = move) =====
function enableGyro(){if(gyroOn)return;gyroOn=true;try{screen.orientation.lock('portrait').catch(()=>{})}catch(_){}
 const add=()=>addEventListener('deviceorientation',e=>{if(e.beta==null||e.gamma==null)return;
  const b=e.beta*Math.PI/180,g=e.gamma*Math.PI/180,dx=Math.cos(b)*Math.sin(g),dy=-Math.sin(b);
  let a=(screen.orientation&&screen.orientation.angle!=null)?screen.orientation.angle:(window.orientation||0);a=((a%360)+360)%360;
  const rc=a===90?-dy:a===270?dy:a===180?-dx:dx;tilt=Math.asin(Math.max(-1,Math.min(1,rc)))*180/Math.PI*flip});
 try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')add()}).catch(()=>{});else add()}catch(_){}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();
 if(state==='title'){const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;
  if(px>W-190&&py>H-56){flip=-flip;return}enableGyro();reset();state='play'}
 else if(state==='end'&&tt>endAt){reset();state='play'}
 else hold=true});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>hold=false));
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;
 if((e.code==='Space'||e.code==='Enter')&&(state==='title'||(state==='end'&&tt>endAt))){reset();state='play';keys={}}});
addEventListener('keyup',e=>keys[e.code]=false);
// ===== 7. UPDATE =====
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function finish(win,msg){state='end';elapsed=TIME-timeLeft;endWin=win;endMsg=msg;endAt=tt+.7;mo.hurt=!win&&msg!=="Time's up!"}
function update(dt){
 if(state!=='play')return;
 let dir=(keys.KeyD?1:0)-(keys.KeyA?1:0);if(!dir)dir=clamp(tilt/TILT_MAX,-1,1);
 const closing=hold||keys.ArrowDown||keys.Space,inv=candyT>0;
 openAmt+=((closing?0:1)-openAmt)*Math.min(1,dt*14);
 const base=lerp(SPEED_CLOSED,SPEED_OPEN,openAmt)*(inv?CANDY_MULT:1);
 let wx=0,wy=0;for(const o of objs)if(o.t==='wind'&&mo.y>o.y&&mo.y<o.y+o.h){if(o.ax==='x')wx+=o.dir*WIND_X;else wy+=o.dir*WIND_Y}
 mo.vy+=(Math.max(30,base+wy)-mo.vy)*Math.min(1,dt*6);
 mo.vx+=(dir*MOVE_SPEED+wx-mo.vx)*Math.min(1,dt*8);
 mo.x=clamp(mo.x+mo.vx*dt,22,W-22);mo.y+=mo.vy*dt;
 timeLeft-=dt;candyT=Math.max(0,candyT-dt);camY=mo.y-MOMO_SCREEN_Y;
 const hh=lerp(HIT_CLOSED,HIT_OPEN,openAmt),top=mo.y-lerp(30,70,openAmt);
 const me={x:mo.x-hh,y:top,w:hh*2,h:mo.y+32-top};
 for(let i=objs.length-1;i>=0;i--){const o=objs[i];
  if(o.t==='bird'){o.x+=o.dir*o.sp*dt;if(o.x<-70)o.x=W+70;if(o.x>W+70)o.x=-70}
  if(o.t==='tunnel'){const d=o.y-mo.y;o.gap=lerp(GAP_START,GAP_END,clamp((TUNNEL_TRIGGER-d)/(TUNNEL_TRIGGER-120),0,1))}
  if(Math.abs(o.y-mo.y)>200)continue;
  if(o.t==='candy'&&Math.hypot(o.x-mo.x,o.y-mo.y)<34){candyT=CANDY_TIME;objs.splice(i,1);continue}
  if(inv||candyT>0)continue;
  let bad=false;
  if(o.t==='cloud')bad=hit(me,{x:o.x-o.w*.35,y:o.y-o.h*.28,w:o.w*.7,h:o.h*.56});
  if(o.t==='bird')bad=hit(me,{x:o.x-o.w*.3,y:o.y-o.h*.28,w:o.w*.6,h:o.h*.56});
  if(o.t==='tunnel')bad=hit(me,{x:-20,y:o.y,w:o.c-o.gap/2+20,h:o.h})||hit(me,{x:o.c+o.gap/2,y:o.y,w:W,h:o.h});
  if(bad){finish(false,'Momo got caught!');return}
 }
 if(mo.y>=LEN-45){finish(true,'Safe landing!');return}
 if(timeLeft<=0){timeLeft=0;finish(false,"Time's up!")}
}
// ===== 8. DRAW: MOMO (parts assembled + free-fall animation) =====
function drawMomo(x,y,open,inv,hurt,vx){
 const c=1-open,f=Math.sin(tt*(9+c*13));
 const face=hurt?'headHurt':inv?'headHappy':c>.5?'headSurprised':'headNormal';
 ctx.save();ctx.translate(x,y);
 if(inv){ctx.globalAlpha=.6+.25*Math.sin(tt*18);ctx.shadowColor='#ff9fe0';ctx.shadowBlur=25}
 ctx.rotate(vx/MOVE_SPEED*.15+f*.04*c);ctx.scale(MOMO_SCALE,MOMO_SCALE);ctx.translate(0,f*(5+c*9));
 ctx.save();ctx.translate(-150,-70);ctx.rotate(-vx/MOVE_SPEED*.1+f*.03);   // parasol pivots at the gripping hand
 img('shaft',0,-57,.8);
 if(open>.5)img('canopy',0,-279,lerp(.5,1,(open-.5)*2),1);else img('closed',0,-215,.37);   // closed-umbrella sprite when held
 ctx.restore();
 ctx.save();ctx.translate(35,30);ctx.rotate(-.15+f*.15-c*1.0);img('armR',49,0,.55,.55,Math.PI);ctx.restore();   // free arm (base hidden behind torso), flails up when closed
 const sw=Math.sin(tt*(4+c*8)),sw2=Math.sin(tt*(4+c*8)+1.7),amp=.3+c*.35;   // legs dangle and swing from the torso
 ctx.save();ctx.translate(-28,86);ctx.rotate(sw*amp);img('footL',-2,34,.6);ctx.restore();
 ctx.save();ctx.translate(30,88);ctx.rotate(sw2*amp);img('footR',2,36,.6);ctx.restore();
 img('torso',0,45,.6);
 img('armL',-117,-26,-.75,.75);   // palm grips the handle, arm joins the torso
 img(face,0,-80,.8,.8,f*.04);
 ctx.restore();
 if(inv){ctx.save();ctx.translate(x,y);for(let i=0;i<6;i++){const a=tt*3+i*1.047;ctx.fillStyle=`hsl(${(i*60+tt*200)%360},90%,75%)`;ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('✦',Math.cos(a)*42,Math.sin(a)*34)}ctx.restore()}
}
// ===== 9. DRAW: WORLD =====
function drawWorld(){
 ctx.drawImage(A.sky,0,0,W,H);
 ctx.globalAlpha=.28;for(let i=0;i<7;i++){const m=H+200,py=(((i*230-camY*.4)%m)+m)%m-100;img('cloudMid',(i*137)%W,py,.5)}ctx.globalAlpha=1;
 for(const o of objs){const sy=o.y-camY;if(sy<-300||sy>H+300)continue;
  if(o.t==='cloud')img(o.img,o.x,sy,.5);
  else if(o.t==='bird')img('sidebird',o.x,sy,o.dir>0?-.55:.55,.55);
  else if(o.t==='candy')img('candy',o.x,sy+Math.sin(tt*4+o.x)*5,.3,.3,Math.sin(tt*3)*.2);
  else if(o.t==='tunnel'){const l=o.c-o.gap/2,r=o.c+o.gap/2;
   ctx.drawImage(A.tunnel,-20,sy,l+20,o.h);ctx.drawImage(A.tunnel,r,sy,W-r+20,o.h)}
  else if(o.t==='wind'){ctx.save();ctx.beginPath();ctx.rect(0,sy,W,o.h);ctx.clip();ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(0,sy,W,o.h);
   for(let i=0;i<4;i++){const ph=((tt*90+i*80)%320);
    if(o.ax==='x')img('windside',(o.dir>0?ph-20:W+20-ph)%W+0,sy+60+(i%2)*90,.7*o.dir*-1,.7);
    else img('windup',60+i*80,sy+(o.dir<0?o.h-ph*.8:ph*.8),.8,.8*(o.dir<0?1:-1))}
   ctx.restore()}}
 const gy=LEN-camY;if(gy<H){ctx.fillStyle='#bfe8b0';ctx.fillRect(0,gy,W,H-gy);ctx.fillStyle='#9fd68f';ctx.fillRect(0,gy,W,8);text('LAND HERE',W/2,gy+50,26,'#fff4e6')}
}
// ===== 10. DRAW: HUD / SCREENS =====
function drawHUD(){
 panel(10,10,110,36);text('⏱ '+timeLeft.toFixed(1),65,36,20);panel(W-120,10,110,36);text('▼ '+Math.round(clamp(mo.y/LEN,0,1)*1000)+' m',W-65,36,20);
 const p=clamp(mo.y/LEN,0,1);ctx.fillStyle='rgba(255,244,230,.8)';ctx.strokeStyle='#5a3418';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(W-22,70,12,600,6);ctx.fill();ctx.stroke();
 img('headNormal',W-16,70+p*600,.1);
 if(candyT>0){panel(10,54,110,30);ctx.fillStyle='#f58ab5';ctx.fillRect(16,64,98*candyT/CANDY_TIME,10);text('CANDY!',65,48+34,0)}
}
function drawEnd(){
 ctx.fillStyle='rgba(90,52,24,.35)';ctx.fillRect(0,0,W,H);panel(40,260,280,270);
 text(endMsg,W/2,312,26);
 if(endWin){const s=elapsed<TIME*.5?3:elapsed<TIME*.75?2:1;text('★'.repeat(s)+'☆'.repeat(3-s),W/2,362,36,'#f2a93b')}
 else text(endMsg==="Time's up!"?'Try closing the parasol more!':'Dodge the gimmicks!',W/2,358,15);
 text('Distance: '+Math.round(clamp(mo.y/LEN,0,1)*1000)+' m',W/2,408,20);
 text(endWin?'Time taken: '+elapsed.toFixed(1)+' s':'Time: '+elapsed.toFixed(1)+' s',W/2,440,20);
 if(tt>endAt)text('Tap to retry',W/2,495,22,'#e0709f');
}
function drawTitle(){
 ctx.drawImage(A.sky,0,0,W,H);img('cloudBig',90,640,.7);img('cloudMid',280,150,.6);
 drawMomo(W/2,380+Math.sin(tt*2)*8,1,false,false,0);
 text("Momo's",W/2,100,46,'#fff4e6');text('Parasol Drop',W/2,152,42,'#fff4e6');
 panel(30,560,300,130);text('Hold: close parasol (fall faster!)',W/2,597,15);text('Phone: tilt  |  PC: A / D keys',W/2,622,15);text('Fall 1000 m before time runs out',W/2,647,15);
 text('Tap to start',W/2,682,22,'#e0709f');
 panel(W-190,H-50,170,36);text('Tilt: '+(flip>0?'normal':'reversed')+' (tap)',W-105,H-26,14);
}
// ===== 11. MAIN LOOP =====
const wrongWay=()=>innerWidth>innerHeight&&matchMedia('(pointer:coarse)').matches;
let last=0;
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;tt+=dt;if(!wrongWay())update(dt);
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 if(state==='title')drawTitle();
 else{ctx.save();if(mo.hurt&&state==='end')ctx.translate(rand(-3,3),rand(-3,3));drawWorld();drawMomo(mo.x,mo.y-camY,openAmt,candyT>0,mo.hurt,mo.vx);ctx.restore();drawHUD();if(state==='end')drawEnd()}
 requestAnimationFrame(frame)}
loadAll().then(()=>requestAnimationFrame(frame));
</script></body></html>
